<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

    <!-- SEO -->
    {% include seo.html %}

    <!-- Schema.org Structured Data -->
    {% include schema.html %}
<!-- Essential SEO Meta Tags -->
<meta name="description" content="Santiago López Begines - Biomedical Data Science Consultant. 15+ years neuroscience research, ML pipelines, proteomics, electrophysiology analysis.">
<meta name="keywords" content="neuroscience data science, biomedical consulting, proteomics pipeline, electrophysiology analysis, neurotech, machine learning biomarker discovery">
<meta name="author" content="Santiago López Begines">
<link rel="canonical" href="https://slopezbegines.github.io{{ page.url | default: '/' }}">

<!-- Open Graph (LinkedIn, Facebook) -->
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Santiago López Begines">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Biomedical Data Science Consulting - ML pipelines, proteomics, electrophysiology{% endif %}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://slopezbegines.github.io{{ page.url | default: '/' }}">
<meta property="og:image" content="https://slopezbegines.github.io/assets/images/photoprofile.jpeg">
<meta property="og:site_name" content="Santiago López Begines">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}Santiago López Begines">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Biomedical Data Science Consulting{% endif %}">
<meta name="twitter:image" content="https://slopezbegines.github.io/assets/images/photoprofile.jpeg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- Google Analytics -->
    {% include google-analytics.html %}
</head>
<body>
    {% include header.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <!-- Smooth scroll -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
