<header class="site-header">
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo" aria-label="Home">
                <svg class="logo-svg" viewBox="-4 -5 84 84" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <!-- AP trace -->
                    <path fill="none" stroke="#7FBA9E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
                        d="M 17.683441,54.928516 34.693949,5.5805993 49.537966,70.390383 69.030799,53.482658"/>
                    <!-- Soma -->
                    <circle cx="17.683441" cy="54.928516" r="7" fill="#7FBA9E" opacity="0.92"/>
                    <!-- Dendritic stub -->
                    <path fill="none" stroke="#7FBA9E" stroke-width="1.6" opacity="0.55"
                        d="M 17.344482,54.815533 10.237016,42.531292"/>
                    <circle cx="10.237016" cy="42.531292" r="2.2" fill="#7FBA9E" opacity="0.55"/>
                    <!-- Peak — coral accent -->
                    <circle cx="34.647152" cy="5.6862454" r="4.8" fill="#E07050" opacity="1.00"/>
                    <!-- Hyperpolarisation -->
                    <circle cx="50.177113" cy="69.685051" r="2.8" fill="#7FBA9E" opacity="0.72"/>
                    <!-- Recovery -->
                    <circle cx="69.331062" cy="53.260921" r="1.8" fill="#7FBA9E" opacity="0.50"/>
                </svg>
                <span class="logo-text">López Begines</span>
            </a>

            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu">
                {% for item in site.navigation %}
                <li class="nav-item">
                    <a href="{{ item.url }}" class="nav-link">{{ item.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </nav>
</header>
